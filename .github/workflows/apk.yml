name: Compilar APK (Android)

on:
  workflow_dispatch:
    push:
        tags: ["v*"]

        permissions:
          contents: write

          jobs:
            apk:
                runs-on: ubuntu-latest
                    steps:
                          - uses: actions/checkout@v4
                                - uses: actions/setup-node@v4
                                        with:
                                                  node-version: "20"
                                                        - uses: actions/setup-java@v4
                                                                with:
                                                                          distribution: temurin
                                                                                    java-version: "17"
                                                                                          - name: Preparar la app web con la URL absoluta de GitHub Pages
                                                                                                  run: |
                                                                                                            OWNER="${GITHUB_REPOSITORY_OWNER,,}"
                                                                                                                      REPO="${GITHUB_REPOSITORY#*/}"
                                                                                                                                mkdir -p movil/www
                                                                                                                                          cp -r app/. movil/www/
                                                                                                                                                    rm -f movil/www/sw.js
                                                                                                                                                              sed -i "s|baseDatos: \"./data/\"|baseDatos: \"https://${OWNER}.github.io/${REPO}/data/\"|; s|repoWiki: \"\"|repoWiki: \"${GITHUB_REPOSITORY}\"|" movil/www/config.js
                                                                                                                                                                        cat movil/www/config.js
                                                                                                                                                                              - name: Generar proyecto Android con Capacitor
                                                                                                                                                                                      working-directory: movil
                                                                                                                                                                                              run: |
                                                                                                                                                                                                        npm install
                                                                                                                                                                                                                  npx cap add android
                                                                                                                                                                                                                            npx cap sync android
                                                                                                                                                                                                                                  - name: Compilar APK
                                                                                                                                                                                                                                          working-directory: movil/android
                                                                                                                                                                                                                                                  run: ./gradlew assembleDebug --no-daemon
                                                                                                                                                                                                                                                        - uses: actions/upload-artifact@v4
                                                                                                                                                                                                                                                                with:
                                                                                                                                                                                                                                                                          name: archivos-wiki-apk
                                                                                                                                                                                                                                                                                    path: movil/android/app/build/outputs/apk/debug/app-debug.apk
                                                                                                                                                                                                                                                                                          - name: Adjuntar el APK a la release (solo con etiqueta vX.Y.Z)
                                                                                                                                                                                                                                                                                                  if: startsWith(github.ref, 'refs/tags/')
                                                                                                                                                                                                                                                                                                          env:
                                                                                                                                                                                                                                                                                                                    GH_TOKEN: ${{ github.token }}
                                                                                                                                                                                                                                                                                                                            run: gh release create "$GITHUB_REF_NAME" movil/android/app/build/outputs/apk/debug/app-debug.apk --generate-notes
