<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Archivos Wiki</title>
  <meta name="theme-color" content="#14213d">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <header>
    <h1>Archivos Wiki</h1>
    <p class="aviso">Aparecer en un documento <strong>no implica culpabilidad</strong> ni participación en delito alguno. Muchas menciones son de abogados, periodistas, testigos, víctimas o contactos.</p>
  </header>
  <main>
    <form id="form" role="search">
      <input id="q" type="search" placeholder="Nombre de la persona" autocomplete="off" autocapitalize="words" aria-label="Nombre de la persona" required minlength="3">
      <button type="submit">Buscar</button>
    </form>
    <p id="estado" role="status" aria-live="polite"></p>
    <section id="wiki" hidden></section>
    <section id="auto" hidden>
      <h2>Menciones automáticas <small>(OCR sin revisar)</small></h2>
      <div id="lista"></div>
      <button id="mas" type="button" hidden>Ver más</button>
    </section>
  </main>
  <footer id="pie"></footer>
  <script src="config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
